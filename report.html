<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Fault</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Campus Maintenance Fault Reporting System</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="report.html">Report Fault</a></li>
        </ul>
    </nav>
</header>

<main>

<section class="form-container">

    <h2>Fault Report Form</h2>

    <form id="faultForm" action="php/process.php" method="POST">

        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>
            <small class="error"></small>
        </div>

        <div class="form-group">
            <label for="studentid">Student ID</label>
            <input type="text" id="studentid" name="studentid" required>
            <small class="error"></small>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            <small class="error"></small>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
            <small class="error"></small>
        </div>

        <div class="form-group">
            <label for="building">Building</label>

            <select id="building" name="building" required>
                <option value="">Select Building</option>
                <option>Library</option>
                <option>Administration Block</option>
                <option>Lecture Hall</option>
                <option>Computer Lab</option>
                <option>Hostels</option>
            </select>

            <small class="error"></small>
        </div>

        <div class="form-group">
            <label for="category">Fault Category</label>

            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option>Electrical</option>
                <option>Plumbing</option>
                <option>Furniture</option>
                <option>Internet</option>
                <option>Security</option>
            </select>

            <small class="error"></small>
        </div>

        <div class="form-group">

            <label>Severity</label>

            <div class="radio-group">

                <label>
                    <input type="radio" name="severity" value="Low" required>
                    Low
                </label>

                <label>
                    <input type="radio" name="severity" value="Medium">
                    Medium
                </label>

                <label>
                    <input type="radio" name="severity" value="High">
                    High
                </label>

            </div>

            <small class="error"></small>

        </div>

        <div class="form-group">
            <label for="reportdate">Date</label>
            <input type="date" id="reportdate" name="reportdate" required>
            <small class="error"></small>
        </div>

        <div class="form-group">

            <label for="description">Fault Description</label>

            <textarea
                id="description"
                name="description"
                rows="6"
                maxlength="250"
                required></textarea>

            <p id="counter">
                <span id="charCount">0</span> / 250 Characters
            </p>

            <small class="error"></small>

        </div>

        <div class="preview-box">

            <h3>Report Preview</h3>

            <p id="previewText">
                Your report preview will appear here.
            </p>

        </div>

        <button type="submit">Submit Report</button>

        <p id="status"></p>

    </form>

</section>

</main>

<footer>
    <p>&copy; 2026 Campus Maintenance Fault Reporting System</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
